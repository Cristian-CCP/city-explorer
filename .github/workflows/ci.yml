name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    name: Test & Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run unit and integration tests
        working-directory: backend
        run: npm test -- --ci

      - name: Build Docker images and start stack
        run: docker compose up --build -d

      - name: Wait for services and run smoke tests
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          docker compose ps
          curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
          curl -fsS "http://localhost:8080/api/cities?q=colombia" | grep -q '"count":2'

      - name: Tear down stack
        if: always()
        run: docker compose down -v
