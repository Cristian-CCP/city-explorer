# Travis CI - City Explorer
os: linux
dist: jammy
language: node_js
node_js:
  - "20"

services:
  - docker

branches:
  only:
    - main
    - develop
    - /^feature\/.*$/

cache:
  npm: true

install:
  - cd backend
  - npm ci --no-audit --no-fund
  - cd ..

script:
  # 1. Pruebas unitarias / de integración del backend
  - (cd backend && npm test -- --ci)
  # 2. Build de las imágenes Docker
  - docker build -t city-explorer-backend:${TRAVIS_COMMIT:0:7} ./backend
  - docker build -t city-explorer-frontend:${TRAVIS_COMMIT:0:7} ./frontend
  - docker image ls | grep city-explorer
