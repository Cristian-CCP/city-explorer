language: node_js
node_js:
  - "20"

services:
  - docker

cache:
  directories:
    - backend/node_modules

install:
  - cd backend && npm ci --no-audit --no-fund && cd ..

script:
  - cd backend && npm test -- --ci && cd ..
  - docker build --target runtime -t city-explorer-backend:ci ./backend
  - docker build --target runtime -t city-explorer-frontend:ci ./frontend
  - docker compose up -d
  - |
    for i in $(seq 1 15); do
      if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
        break
      fi
      sleep 2
    done
  - curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
  - curl -fsS "http://localhost:8080/api/cities?q=colombia" | grep -q '"count":2'

after_script:
  - docker compose down -v
