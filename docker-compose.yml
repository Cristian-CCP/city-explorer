name: city-explorer

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: city-explorer-backend:latest
    container_name: city-explorer-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: city-explorer-frontend:latest
    container_name: city-explorer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - ci-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  ci-network:
    name: ci-network
    driver: bridge
